*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "Pretendard","Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left)) 48px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:16px}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
.meta{color:var(--muted);font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 16px;min-width:110px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.bar input{flex:1 1 220px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font:inherit}
.tab{padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--fg);font:inherit;cursor:pointer}
.tab[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card a{color:var(--fg);text-decoration:none;font-weight:600;line-height:1.4}
.card a:hover{color:var(--accent);text-decoration:underline}
.card ul{margin:2px 0 0;padding-left:18px;font-size:13.5px}.card li{margin:2px 0}
.card p{margin:0;color:var(--muted);font-size:13.5px}
.tag{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}
.tag em{font-style:normal;background:var(--chip);color:var(--accent);padding:1px 8px;border-radius:999px}
.sec{margin-top:28px}.sec h2{margin:0 0 4px;font-size:18px}.sec .lead{margin:0 0 12px;color:var(--muted);font-size:13px}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{margin-top:24px;color:var(--muted);font-size:12px}
</style>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
const fmt=s=>{const d=new Date(s);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const g=new Date(D.generated);
$('gen').textContent=`${D.today} 오늘자 · ${String(g.getHours()).padStart(2,'0')}:${String(g.getMinutes()).padStart(2,'0')} 업데이트`;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const cats=D.cats.filter(c=>D.items.some(i=>i.cat===c)||true);
const s=$('stats');cats.forEach(c=>{const d=el('div','stat');d.append(el('b','',D.items.filter(i=>i.cat===c).length),el('span','',c));s.append(d)});
const L=$('list');
cats.forEach(c=>{const r=D.items.filter(i=>i.cat===c);const sec=el('section','sec');
 sec.append(el('h2','',c));

 sec.append(el('p','lead',`${r.length}건 · 최신순 · 요약 아래 3줄은 기사 본문 앞부분에서 추출`));
 const grid=el('div','grid');
 r.forEach(i=>{const k=el('article','card');const a=el('a','',i.title);a.href=i.link;a.target='_blank';a.rel='noopener noreferrer';
  k.append(a);if(i.summary)k.append(el('p','',i.summary));
  if((i.points||[]).length){const u=el('ul');i.points.forEach(x=>u.append(el('li','',x)));k.append(u)}
  const tg=el('div','tag');tg.append(el('em','',i.src),el('span','',fmt(i.ts)));k.append(tg);grid.append(k)});
 sec.append(grid);L.append(sec)});
$('foot').textContent='출처: '+D.status.map(s=>s.src+(s.ok?'':' (불러오기 실패)')).join(' · ')+' · 요약은 각 매체 RSS 설명문 기준입니다.';
